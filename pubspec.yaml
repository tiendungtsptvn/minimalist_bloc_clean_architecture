name: minimalist_bloc_clean_architecture
description: A base flutter project using clean architecture and bloc with minimalist structure.
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: '>=3.1.3 <4.0.0'

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter


  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.2

  ##__________________________________ State management ____________________________________
  # Widgets that make it easy to integrate blocs and cubits into Flutter.
  flutter_bloc: 8.1.3


  ##_______________________________________  Utils _________________________________________
  # A Dart package that helps to implement value based equality without
  # needing to explicitly override == and hashCode.
  equatable: 2.0.5
  # Wraps platform-specific persistent storage for simple data.
  shared_preferences: 2.2.2
  # A powerful HTTP networking package for Dart/Flutter.
  dio: 5.4.0
  # A blazing-fast service locator for Dart and Flutter that makes dependency management simple.
  get_it: 8.0.0

  ##_____________________________________ Libs for UI _______________________________________
  #An SVG rendering and widget library for Flutter.
  flutter_svg: 2.0.9
  # A flutter plugin for adapting screen and font size.Guaranteed to look good on different models.
  flutter_screenutil: 5.9.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  flutter_gen_runner: 5.12.0
  build_runner: 2.10.4
  intl_utils: 2.8.13

flutter_gen:
  output: lib/resource/gen/ # Optional (default: lib/gen/)
  line_length: 100 # Optional (default: 80)

  # Optional
  integrations:
    flutter_svg: true

# The following section is specific to Flutter packages.
flutter:
  generate: true

  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/solid/
    - assets/fonts/
  fonts:
    - family: Lato
      fonts:
        - asset: assets/fonts/Lato-Italic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/Lato-Thin.ttf
          weight: 200
        - asset: assets/fonts/Lato-ThinItalic.ttf
          weight: 200
          style: italic
        - asset: assets/fonts/Lato-Light.ttf
          weight: 300
        - asset: assets/fonts/Lato-LightItalic.ttf
          weight: 300
          style: italic
        - asset: assets/fonts/Lato-Regular.ttf
          weight: 500
        - asset: assets/fonts/Lato-Bold.ttf
          weight: 700
        - asset: assets/fonts/Lato-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: assets/fonts/Lato-Black.ttf
          weight: 900
        - asset: assets/fonts/Lato-BlackItalic.ttf
          weight: 900
          style: italic

flutter_intl:
  enabled: true
  main_locale: vi
  class_name: AppLocale
  arb_dir: lib/l10n
  output_dir: lib/l10n/generated